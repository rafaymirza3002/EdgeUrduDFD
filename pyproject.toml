[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urdu-deepfake-detector"
version = "0.1.0"
description = "Modular Urdu audio deepfake detection FYP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
  "sounddevice>=0.5,<1",
  "streamlit>=1.54,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=urdu_deepfake.audio_ingestion --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["sounddevice", "soundfile"]
ignore_missing_imports = true
packages = ["urdu_deepfake"]
